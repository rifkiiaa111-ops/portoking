<style>
/* BAGIAN 2 - TAMPILAN. Warna utama ada di :root */
:root {
  --bg:#05060b;
  --surface:#0c0e17;
  --surface2:#141722;
  --text:#fff;
  --muted:#a3a7b5;
  --primary:#fff;
  --purple:#b8bdcf;
  --border:rgba(255,255,255,.12);
  --gradient:linear-gradient(120deg,#fff,#aeb5c7,#e6e9f2);
  --glow:rgba(255,255,255,.13);
}
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth}
body{
  font-family:'Inter',sans-serif;background-color:var(--bg);color:var(--text);
  overflow-x:hidden;position:relative;
  background-image:
    radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,.9) 99%,transparent),
    radial-gradient(1px 1px at 30% 80%,rgba(255,255,255,.8) 99%,transparent),
    radial-gradient(2px 2px at 70% 30%,rgba(255,255,255,.9) 99%,transparent),
    radial-gradient(1px 1px at 85% 65%,rgba(255,255,255,.8) 99%,transparent),
    radial-gradient(1px 1px at 50% 50%,rgba(255,255,255,.7) 99%,transparent),
    radial-gradient(2px 2px at 15% 90%,rgba(220,227,255,.8) 99%,transparent);
  background-size:250px 250px,300px 300px,350px 350px,280px 280px,400px 400px,320px 320px;
  background-attachment:fixed;
}
a{text-decoration:none;color:inherit}button{font-family:inherit}
.container{width:min(1120px,88%);margin:auto}

/* NAVIGATION */
header{position:fixed;top:0;width:100%;z-index:1000;background:rgba(5,6,11,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);transition:.3s}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Space Grotesk';font-size:25px;font-weight:700;letter-spacing:-1px}
.logo span{color:var(--primary)}
.nav-links{display:flex;gap:30px;list-style:none}
.nav-links a{color:var(--muted);font-size:13px;font-weight:600;transition:.3s}
.nav-links a:hover,.nav-links a.active{color:var(--primary)}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;padding-top:100px;position:relative;isolation:isolate}
.hero:before{content:"";position:absolute;width:450px;height:450px;background:#a5b5ff;filter:blur(150px);opacity:.12;top:15%;left:-200px;pointer-events:none;z-index:-1}
.hero:after{content:"";position:absolute;width:380px;height:380px;background:#fff;filter:blur(180px);opacity:.045;right:-180px;bottom:5%;pointer-events:none;z-index:-1}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:70px}
.availability{display:inline-flex;gap:10px;align-items:center;padding:9px 15px;border:1px solid var(--border);background:var(--surface);border-radius:30px;color:var(--muted);font-size:12px;margin-bottom:25px}
.dot{width:8px;height:8px;background:#4ade80;border-radius:50%;box-shadow:0 0 12px #4ade80}
.hero h1{font-family:'Space Grotesk';font-size:clamp(45px,6.5vw,75px);line-height:1.08;letter-spacing:-3px;margin-bottom:18px}
.gradient-text{background:var(--gradient);color:transparent;background-clip:text;-webkit-background-clip:text}
.hero-desc{color:var(--muted);line-height:1.9;font-size:15px;max-width:530px}
.hero-buttons{display:flex;flex-wrap:wrap;gap:15px;margin-top:32px}
.btn{padding:14px 23px;border-radius:11px;font-size:13px;font-weight:700;display:inline-flex;gap:10px;align-items:center;justify-content:center;transition:.3s;cursor:pointer}
.btn-primary{background:var(--gradient);color:#080a12;box-shadow:0 0 25px var(--glow)}
.btn-outline{border:1px solid var(--border);color:var(--text);background:var(--surface)}
.btn:hover{transform:translateY(-4px);box-shadow:0 10px 30px var(--glow)}
.socials{display:flex;gap:20px;margin-top:38px}
.socials a{color:var(--muted);font-size:19px;transition:.3s}
.socials a:hover{color:var(--primary);filter:drop-shadow(0 0 8px var(--primary))}

/* Keep the page strictly vertical: prevent accidental horizontal scrolling */
html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: clip;
}
img, video, iframe {
  max-width: 100%;
}
.container, section, header, footer {
  max-width: 100%;
}

/* PROFILE */
.profile-area{display:flex;justify-content:center;position:relative}
.profile-frame{width:310px;height:370px;border-radius:35px;background:linear-gradient(145deg,#fff,#737d99,#dce3f5);padding:5px;transform:rotate(3deg);box-shadow:0 0 45px var(--glow);animation:float 5s ease-in-out infinite}
.profile-inner{width:100%;height:100%;background:var(--surface);border-radius:31px;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
.profile-inner img{display:block;position:relative;width:100%;height:100%;object-fit:cover;z-index:1}
.floating-card{position:absolute;background:var(--surface2);border:1px solid var(--border);padding:14px 18px;border-radius:14px;box-shadow:0 10px 35px rgba(0,0,0,.2);font-size:12px;backdrop-filter:blur(15px)}
.floating-card i{color:var(--primary);margin-right:8px}
.card-one{top:40px;left:-25px}.card-two{bottom:35px;right:-25px}
@keyframes float{0%,100%{transform:translateY(0) rotate(3deg)}50%{transform:translateY(-15px) rotate(3deg)}}

/* GENERAL SECTIONS */
section:not(.hero){padding:110px 0;scroll-margin-top:75px}
.section-heading{margin-bottom:48px}
.eyebrow{color:var(--primary);font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}
.section-heading h2{font-family:'Space Grotesk';font-size:clamp(30px,4vw,43px);letter-spacing:-1.5px}
.section-heading p{color:var(--muted);margin-top:12px;font-size:14px;line-height:1.8}
.about-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:25px}
.panel{background:rgba(12,14,23,.88);border:1px solid var(--border);border-radius:20px;padding:30px;backdrop-filter:blur(10px)}
.about-text{color:var(--muted);line-height:2;font-size:14px}
.about-text strong{color:var(--primary)}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail{background:var(--surface2);padding:16px;border-radius:12px}
.detail small{color:var(--muted);display:block;font-size:11px;margin-bottom:7px}
.detail strong{font-size:13px}

/* EDUCATION */
.timeline{max-width:750px;margin:auto;position:relative;padding-left:35px}
.timeline:before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--primary),var(--purple))}
.timeline-item{position:relative;margin-bottom:25px;padding:24px;border:1px solid var(--border);border-radius:16px;background:rgba(12,14,23,.88);transition:.3s;backdrop-filter:blur(10px)}
.timeline-item:hover{transform:translateX(7px);border-color:var(--primary);box-shadow:0 0 25px var(--glow)}
.timeline-item:before{content:"";position:absolute;left:-35px;top:30px;width:13px;height:13px;border-radius:50%;background:var(--primary);box-shadow:0 0 15px var(--primary)}
.timeline-item .year{color:var(--primary);font-size:11px;font-weight:700;letter-spacing:1px}
.timeline-item h3{margin:8px 0;font-size:19px}
.timeline-item p{color:var(--muted);font-size:13px;line-height:1.7}

/* SEDANG MEMPELAJARI */
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.skill-box{background:rgba(12,14,23,.88);border:1px solid var(--border);padding:22px;border-radius:16px;backdrop-filter:blur(10px)}
.skill-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.skill-name{display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px}
.skill-name i{font-size:22px;color:var(--primary)}
.skill-level{font-size:11px;color:var(--muted)}

/* PROJECTS */
.project-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.project{border:1px solid var(--border);background:rgba(12,14,23,.88);border-radius:19px;overflow:hidden;transition:.3s;backdrop-filter:blur(10px)}
.project:hover{transform:translateY(-7px);border-color:var(--primary);box-shadow:0 0 25px var(--glow)}
.project-visual{height:190px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#343b50,#111522,#080a12)}
.project-visual i{font-size:65px;color:#fff;filter:drop-shadow(0 0 15px rgba(255,255,255,.6))}
.project-info{padding:24px}
.project-info h3{margin-bottom:9px;font-size:19px}
.project-info p{font-size:13px;color:var(--muted);line-height:1.8}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tags span{font-size:10px;color:var(--text);padding:7px 11px;border-radius:7px;background:rgba(255,255,255,.08);border:1px solid var(--border)}

.contact-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 14px;
  margin: 0 auto 30px;
}
.contact-link {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 190px;
  padding: 14px 17px;
  text-align: left;
  color: var(--text);
  background: rgba(255,255,255,.06);
  border: 1px solid var(--border);
  border-radius: 13px;
  transition: .3s;
}
.contact-link:hover {
  transform: translateY(-4px);
  border-color: var(--primary);
  box-shadow: 0 0 20px var(--glow);
}
.contact-link > i {
  font-size: 23px;
  color: var(--primary);
}
.contact-link small, .contact-link strong {
  display: block;
}
.contact-link small {
  color: var(--muted);
  font-size: 10px;
  margin-bottom: 4px;
}
.contact-link strong {
  font-size: 12px;
}
@media(max-width:580px) {
  .contact-links { flex-direction: column; align-items: stretch; }
  .contact-link { min-width: 0; }
}

/* CONTACT & FOOTER */
.contact-box{text-align:center;background:radial-gradient(ellipse at top,#30384d,#10131e 65%,#080a12);border:1px solid var(--border);padding:65px 25px;border-radius:25px}
.contact-box h2{font-family:'Space Grotesk';font-size:clamp(30px,4vw,45px);margin-bottom:15px}
.contact-box p{color:var(--muted);font-size:14px;line-height:1.8;margin-bottom:28px}
footer{border-top:1px solid var(--border);padding:27px 0;text-align:center;color:var(--muted);font-size:12px}
footer span{color:var(--primary)}

/* REVEAL */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s}
.reveal.show{opacity:1;transform:translateY(0)}
::selection{background:#fff;color:#05060b}

/* ANIMATED GALAXY INTRO */
.intro-screen {
  position: fixed;
  inset: 0;
  z-index: 3000;
  display: grid;
  place-items: center;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 48%, rgba(126,145,190,.22), transparent 28%),
    radial-gradient(ellipse at 50% 50%, rgba(55,67,105,.18), transparent 58%),
    #03040a;
  opacity: 1;
  visibility: visible;
  transition: opacity .9s ease, visibility .9s ease;
}
.intro-screen.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.intro-stars, .intro-stars i {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.intro-stars i {
  inset: auto;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 12px 2px rgba(255,255,255,.8);
  animation: starDrift 4s ease-in-out infinite alternate;
}
.intro-stars i:nth-child(1){left:12%;top:18%;animation-delay:-.4s}
.intro-stars i:nth-child(2){left:82%;top:22%;width:2px;height:2px;animation-delay:-1.2s}
.intro-stars i:nth-child(3){left:22%;top:76%;animation-delay:-2s}
.intro-stars i:nth-child(4){left:74%;top:78%;width:4px;height:4px;animation-delay:-.8s}
.intro-stars i:nth-child(5){left:48%;top:12%;width:2px;height:2px;animation-delay:-1.7s}
.intro-stars i:nth-child(6){left:91%;top:55%;animation-delay:-2.5s}
.intro-stars i:nth-child(7){left:7%;top:54%;width:2px;height:2px;animation-delay:-.9s}
.intro-stars i:nth-child(8){left:59%;top:91%;animation-delay:-1.4s}
.shooting-star {
  position: absolute;
  width: 150px;
  height: 2px;
  opacity: 0;
  background: linear-gradient(90deg,transparent,#fff,transparent);
  filter: drop-shadow(0 0 5px #fff);
  transform: rotate(-35deg);
  animation: shootingStar 3.8s linear infinite;
}
.shooting-star-one{top:18%;left:-20%;animation-delay:.5s}
.shooting-star-two{top:62%;left:-25%;animation-delay:2.1s;animation-duration:4.5s}
.intro-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  animation: introRise 1s cubic-bezier(.2,.8,.2,1) both;
}
.intro-galaxy {
  position: relative;
  display: grid;
  place-items: center;
  width: 132px;
  height: 132px;
  margin-bottom: 7px;
}
.galaxy-ring {
  position: absolute;
  border: 1px solid rgba(230,237,255,.55);
  border-radius: 50%;
  box-shadow: 0 0 18px rgba(200,215,255,.12), inset 0 0 15px rgba(200,215,255,.08);
}
.ring-one {
  width: 112px;height: 112px;
  transform: rotateX(65deg) rotateZ(0deg);
  animation: ringRotate 3s linear infinite;
}
.ring-two {
  width: 92px;height: 92px;
  border-style: dashed;
  border-color: rgba(255,255,255,.35);
  transform: rotateX(65deg) rotateZ(60deg);
  animation: ringRotateReverse 5s linear infinite;
}
.galaxy-core {
  display: grid;
  place-items: center;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  color: #080a12;
  font-size: 22px;
  background: radial-gradient(circle at 35% 30%,#fff,#c5cee0 58%,#68748e);
  box-shadow: 0 0 20px rgba(255,255,255,.7),0 0 65px rgba(173,192,235,.4);
  animation: corePulse 1.8s ease-in-out infinite;
}
.intro-logo {
  color: #fff;
  font-family: 'Space Grotesk',sans-serif;
  font-size: clamp(42px,10vw,66px);
  font-weight: 700;
  letter-spacing: 5px;
  text-shadow: 0 0 28px rgba(255,255,255,.45);
  animation: logoGlow 2s ease-in-out infinite alternate;
}
.intro-logo span{color:#aebbd4}
.intro-welcome {
  color:#d5dbea;
  font-size:10px;
  letter-spacing:4px;
  animation: textFade 1.2s ease .35s both;
}
.intro-progress {
  width:170px;height:3px;overflow:hidden;
  background:rgba(255,255,255,.15);
  border-radius:10px;margin-top:9px;
}
.intro-progress span {
  display:block;width:100%;height:100%;
  background:linear-gradient(90deg,#7786a8,#fff);
  transform:scaleX(0);transform-origin:left;
  animation:introLoad 2.35s cubic-bezier(.4,0,.2,1) .1s forwards;
}
.intro-loading {
  color:#858fa8;font-size:8px;letter-spacing:2.5px;
  animation:textFade 1.2s ease .5s both;
}
@keyframes introLoad{to{transform:scaleX(1)}}
@keyframes introRise{from{opacity:0;transform:translateY(25px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes starDrift{from{opacity:.25;transform:translate3d(0,0,0) scale(.7)}to{opacity:1;transform:translate3d(12px,-18px,0) scale(1.5)}}
@keyframes shootingStar{0%{opacity:0;transform:translate3d(0,0,0) rotate(-35deg)}8%{opacity:1}25%{opacity:0;transform:translate3d(125vw,55vh,0) rotate(-35deg)}100%{opacity:0;transform:translate3d(125vw,55vh,0) rotate(-35deg)}}
@keyframes ringRotate{to{transform:rotateX(65deg) rotateZ(360deg)}}
@keyframes ringRotateReverse{to{transform:rotateX(65deg) rotateZ(-300deg)}}
@keyframes corePulse{0%,100%{transform:scale(.92);box-shadow:0 0 20px rgba(255,255,255,.55),0 0 45px rgba(173,192,235,.25)}50%{transform:scale(1.12);box-shadow:0 0 30px rgba(255,255,255,.9),0 0 75px rgba(173,192,235,.55)}}
@keyframes logoGlow{from{text-shadow:0 0 12px rgba(255,255,255,.2)}to{text-shadow:0 0 32px rgba(255,255,255,.65)}}
@keyframes textFade{from{opacity:0;letter-spacing:8px}to{opacity:1;letter-spacing:4px}}

/* GARIS BAWAH MENU */
.nav-links a {
  position:relative;
  display:inline-block;
  padding:10px 0;
  transition:color .25s ease;
}
.nav-links a::after {
  content:"";
  position:absolute;

}

.nav-links a.active::after {width:100%}
/* RESPONSIVE */
@media(max-width:800px){
 .hero-grid,.about-grid{grid-template-columns:1fr}
 .hero-grid{text-align:center;gap:60px}
 .hero-desc{margin:auto}
 .hero-buttons,.socials{justify-content:center}
 .profile-area{margin:0 auto}
 .nav-links{gap:15px}
 .nav-links a{font-size:11px}
}
@media(max-width:580px){
 .container{width:90%}
 /* Navigasi selalu terlihat di bagian atas, dalam dua baris */
 .nav{
   height:auto;
   min-height:68px;
   padding:9px 0 7px;
   display:flex;
   flex-wrap:wrap;
   row-gap:2px;
 }
 .logo{font-size:23px}

   width:100%;

   flex-direction:row;

   justify-content:flex-start;

   overflow-y:hidden;

 }

 section[id]{scroll-margin-top:112px}

 section:not(.hero){padding:85px 0}

 *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}

.profile-inner > i{font-size:90px;color:var(--muted)}

</head>
<body>

<!-- ===== BAGIAN 3 - KERANGKA HALAMAN (tidak perlu diubah) ===== -->

<div class="intro-screen" id="introScreen" aria-label="Memuat website">
 <div class="intro-stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
 <div class="shooting-star shooting-star-one" aria-hidden="true"></div>
 <div class="shooting-star shooting-star-two" aria-hidden="true"></div>
 <div class="intro-content">
  <div class="intro-galaxy" aria-hidden="true">
   <span class="galaxy-ring ring-one"></span>
   <span class="galaxy-ring ring-two"></span>
   <span class="galaxy-core"><i class="fa-solid fa-code"></i></span>
  </div>
  <div class="intro-logo" id="introLogo"></div>
  <p class="intro-welcome" id="introTeks"></p>
  <div class="intro-progress"><span></span></div>
  <small class="intro-loading">INITIALIZING EXPERIENCE</small>
 </div>
</div>

<header>
 <div class="container nav">
  <a href="#home" class="logo" id="navLogo"></a>
  <ul class="nav-links">
   <li><a href="#home" class="active">Home</a></li>
   <li><a href="#about">About</a></li>
   <li><a href="#education">Education</a></li>
   <li><a href="#skills">Learning</a></li>
   <li><a href="#projects">Projects</a></li>
   <li><a href="#contact">Contact</a></li>
  </ul>
 </div>
</header>

<section class="hero" id="home"></section>
<section id="about"></section>
<section id="education"></section>
<section id="skills"></section>
<section id="projects"></section>
<section id="contact"></section>
<footer id="footer"></footer>

<script>
/* =====================================================================
   BAGIAN 4 - LOGIKA WEBSITE (tidak perlu diubah)
   ===================================================================== */

const $ = id => document.getElementById(id);

// Layar loading: selalu hilang, walaupun ada error di bawah
const intro = $('introScreen');
const hideIntro = () => intro && intro.classList.add('hide');
window.addEventListener('load', () => setTimeout(hideIntro, 2600));
setTimeout(hideIntro, 4000);

// Potongan HTML yang dipakai berulang
const heading = (label, [putih, warna], deskripsi = '') => `
  <div class="section-heading reveal">
    <p class="eyebrow">${label}</p>
    <h2>${putih} <span class="gradient-text">${warna}</span></h2>
    ${deskripsi ? `<p>${deskripsi}</p>` : ''}
  </div>`;

function render(d) {
  const waLink = 'https://wa.me/' + d.whatsapp;
  const igLink = 'https://www.instagram.com/' + d.instagram;
  const ttLink = 'https://www.tiktok.com/@' + d.tiktok;
  const ext = 'target="_blank" rel="noopener noreferrer"';

  document.title = d.judulHalaman;
  $('introLogo').innerHTML = $('navLogo').innerHTML = `${d.logo}<span>.</span>`;
  $('introTeks').textContent = d.introTeks;

  // HERO
  $('home').innerHTML = `
  <div class="container hero-grid">
    <div class="hero-content reveal">
      <div class="availability"><span class="dot"></span>${d.status}</div>
      <h1>${d.sapaan}<br><span class="gradient-text">${d.nama}</span></h1>
      <p class="hero-desc">${d.deskripsi}</p>
      <div class="hero-buttons">
        <a href="#projects" class="btn btn-primary">${d.tombolUtama} <i class="fa-solid fa-arrow-right"></i></a>
        <a href="#contact" class="btn btn-outline">${d.tombolKedua}</a>
      </div>
      <div class="socials">
        <a href="${ttLink}" ${ext} aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
        <a href="${igLink}" ${ext} aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="${waLink}" ${ext} aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
      </div>
    </div>
    <div class="profile-area reveal">
      <div class="profile-frame">
        <div class="profile-inner">
          <img id="foto" src="${d.foto || FOTO_TERTANAM}" alt="Foto ${d.nama}" style="object-position:${d.fotoPosisi}">
        </div>
      </div>
      <div class="floating-card card-one"><i class="fa-solid fa-code"></i>${d.kartuAtas}</div>
      <div class="floating-card card-two"><i class="fa-solid fa-graduation-cap"></i>${d.kartuBawah}</div>
    </div>
  </div>`;

  // Kalau foto gagal dimuat, tampilkan ikon orang
  const foto = $('foto');
  const fotoGagal = () => foto.replaceWith(Object.assign(document.createElement('i'), { className: 'fa-solid fa-user' }));
  foto.addEventListener('error', fotoGagal);
  if (foto.complete && foto.naturalWidth === 0) fotoGagal();

  // ABOUT
  $('about').innerHTML = `
  <div class="container">
    ${heading('About Me', d.about.judul)}
    <div class="about-grid">
      <div class="panel reveal"><p class="about-text">${d.about.teks}</p></div>
      <div class="panel reveal"><div class="details">
        ${d.about.detail.map(([l, v]) => `<div class="detail"><small>${l}</small><strong>${v}</strong></div>`).join('')}
      </div></div>
    </div>
  </div>`;

  // EDUCATION
  $('education').innerHTML = `
  <div class="container">
    ${heading('Education', d.education.judul)}
    <div class="timeline">
      ${d.education.daftar.map(e => `
      <div class="timeline-item reveal">
        <span class="year">${e.tahun}</span>
        <h3>${e.judul}</h3>
        <p>${e.teks}</p>
      </div>`).join('')}
    </div>
  </div>`;

  // SEDANG MEMPELAJARI
  $('skills').innerHTML = `
  <div class="container">
    ${heading('Learning', d.belajar.judul)}
    <div class="skills-grid">
      ${d.belajar.daftar.map(s => `
      <div class="skill-box reveal">
        <div class="skill-top">
          <div class="skill-name"><i class="${s.ikon}"></i>${s.nama}</div>
          <span class="skill-level">${s.ket}</span>
        </div>
      </div>`).join('')}
    </div>
  </div>`;

  // PROJECTS
  $('projects').innerHTML = `
  <div class="container">
    ${heading('Projects', d.projects.judul, d.projects.deskripsi)}
    <div class="project-grid">
      ${d.projects.daftar.map(p => `
      <article class="project reveal">
        <div class="project-visual"><i class="${p.ikon}"></i></div>
        <div class="project-info">
          <h3>${p.nama}</h3>
          <p>${p.teks}</p>
          <div class="tags">${p.tag.map(t => `<span>${t}</span>`).join('')}</div>
        </div>
      </article>`).join('')}
    </div>
  </div>`;

  // CONTACT
  $('contact').innerHTML = `
  <div class="container">
    <div class="contact-box reveal">
      <p class="eyebrow">Contact</p>
      <h2>${d.contact.judul[0]} <span class="gradient-text">${d.contact.judul[1]}</span></h2>
      <p>${d.contact.teks}</p>
      <div class="contact-links">
        <a class="contact-link" href="${waLink}" ${ext}><i class="fa-brands fa-whatsapp"></i><span><small>WhatsApp</small><strong>${d.whatsappTampil}</strong></span></a>
        <a class="contact-link" href="${igLink}" ${ext}><i class="fa-brands fa-instagram"></i><span><small>Instagram</small><strong>@${d.instagram}</strong></span></a>
        <a class="contact-link" href="${ttLink}" ${ext}><i class="fa-brands fa-tiktok"></i><span><small>TikTok</small><strong>@${d.tiktok}</strong></span></a>
      </div>
      <a href="${waLink}" ${ext} class="btn btn-primary">${d.contact.tombol} <i class="fa-solid fa-paper-plane"></i></a>
    </div>
  </div>`;

  // FOOTER
  $('footer').innerHTML = `<div class="container">&copy; ${new Date().getFullYear()} <span>${d.footer}</span>. All rights reserved.</div>`;
}

function aktifkanFitur() {
  // Animasi muncul saat scroll
  const io = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add('show');
    io.unobserve(e.target);
  }), { threshold: .15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  // Menu aktif mengikuti scroll
  const links = [...document.querySelectorAll('.nav-links a')];
  const secs = links.map(a => document.querySelector(a.getAttribute('href')));
  const spy = () => {
    const y = window.scrollY + 140;
    let cur = 0;
    secs.forEach((s, i) => { if (s && s.offsetTop <= y) cur = i; });
    links.forEach((a, i) => a.classList.toggle('active', i === cur));
  };
  window.addEventListener('scroll', spy, { passive: true });
  spy();
}

document.addEventListener('DOMContentLoaded', () => {
  try {
    render(DATA);
    aktifkanFitur();
  } catch (err) {
    console.error('Ada kesalahan di isi website (bagian 1):', err);
    hideIntro();
  }
});
</script>
